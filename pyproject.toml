[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incubrix-option2-schema-foundation"
version = "0.1.0"
description = "Schema foundation for the IncuBrix Option 2 assessment"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.8,<3.0", "PyYAML>=6.0,<7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
