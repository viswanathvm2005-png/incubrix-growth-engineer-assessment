<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IG-09 - Draft Instagram Graphic</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:#f8f7ff;
background:radial-gradient(ellipse at 85% 8%,#493b83 0,transparent 36%),
linear-gradient(145deg,#11152c,#171b39 55%,#22234b)}
.canvas{width:1080px;height:1350px;padding:78px 76px;position:relative}
.kicker{font-size:22px;font-weight:700;letter-spacing:5px;color:#9de9ff}
h1{font-size:65px;line-height:1.05;letter-spacing:-2px;margin:38px 0 14px;font-weight:800}
.accent{color:#9de9ff}
.subtitle{font-size:27px;line-height:1.4;color:#d8d9ef;max-width:820px;margin-bottom:42px}
.panel{border:1px solid #555782;background:#202443;border-radius:28px;padding:22px 30px}
.item{display:flex;align-items:center;gap:22px;min-height:104px;border-bottom:1px solid #414568;font-size:25px;line-height:1.3;font-weight:600}
.item:last-child{border-bottom:0}
.check{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:42px;height:42px;border-radius:14px;background:#9de9ff;color:#161b37;font-size:25px;font-weight:800}
.footer{position:absolute;left:76px;right:76px;bottom:60px;border-top:1px solid #50557b;padding-top:24px;display:flex;justify-content:space-between;align-items:center;font-size:18px;letter-spacing:3px;font-weight:700;color:#c8cae8}
.dot{width:12px;height:12px;border-radius:50%;background:#9de9ff;display:inline-block;margin-right:12px}
</style>
</head>
<body>
<main class="canvas">
<div class="kicker">PRACTICAL CONTENT NOTES&nbsp; / &nbsp;IG-09</div>
<h1>YOUR CONTENT<br><span class="accent">PLANNING CHECKLIST</span></h1>
<div class="subtitle">Before you create, make the plan clear.</div>
<section class="panel"><div class="item"><span class="check">✓</span><span>Choose one audience problem</span></div>
<div class="item"><span class="check">✓</span><span>Write one useful takeaway</span></div>
<div class="item"><span class="check">✓</span><span>Pick the best format</span></div>
<div class="item"><span class="check">✓</span><span>Add a clear call to action</span></div>
<div class="item"><span class="check">✓</span><span>Check facts and usage rights</span></div></section>
<footer class="footer"><span><i class="dot"></i>PLAN WITH PURPOSE</span><span>QUICK GUIDE</span></footer>
</main>
</body>
</html>
