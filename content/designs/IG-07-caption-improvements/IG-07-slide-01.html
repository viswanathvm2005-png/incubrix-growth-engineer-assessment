<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IG-07 - Slide 1</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:#17182b;color:#f7f7fb}
.slide{width:1080px;height:1350px;background:#17182b;border:1px solid #383954;
padding:88px 86px;display:flex;flex-direction:column;justify-content:space-between;
overflow:hidden;position:relative}
.topline{color:#b8b9ff;font-size:25px;letter-spacing:3px;font-weight:700}
.content{position:relative;z-index:1;margin:auto 0;padding:30px 0}
h1{font-size:66px;line-height:1.05;letter-spacing:-1.5px;margin:0 0 32px;overflow-wrap:anywhere}
p{color:#e0e1f0;font-size:36px;line-height:1.4;margin:0}
.bottom{border-top:1px solid #4c4d69;padding-top:26px;display:flex;justify-content:space-between;
gap:20px;align-items:end}
.small{color:#b8b9ff;font-size:22px;line-height:1.4;max-width:75%}
.count{font-size:22px;font-weight:700;white-space:nowrap}
.accent{position:absolute;width:260px;height:260px;border:1px solid #5d5e85;
border-radius:50%;right:-130px;top:20%;pointer-events:none}
</style>
</head>
<body>
<main class="slide">
<div class="accent"></div>
<div class="topline">IG-07 / CREATOR NOTES</div>
<section class="content">
<h1>MAKE YOUR CAPTIONS CLEARER</h1>
<p>Three simple edits to make your next caption easier to follow.</p>
</section>
<footer class="bottom">
<div class="small">A practical writing guide</div>
<div class="count">1 / 5</div>
</footer>
</main>
</body>
</html>
